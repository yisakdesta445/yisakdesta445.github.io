<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Premium Blood Sugar Tracker</title>
  <style>
    :root {
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
      --success-color: #10b981;
      --danger-color: #ef4444;
      --warning-color: #f59e0b;
      --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --text-color: #1f2937;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-gradient);
      margin: 0;
      padding: 30px 15px;
      min-height: 100vh;
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: rgba(255, 255, 255, 0.95);
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      backdrop-filter: blur(10px);
    }

    h1, h2 {
      margin-top: 0;
      color: #312e81;
      font-weight: 700;
      text-align: center;
    }

    h1 { font-size: 28px; margin-bottom: 25px; }
    h2 { font-size: 24px; margin-bottom: 20px; }

    .input-group {
      margin-bottom: 15px;
    }

    input {
      padding: 12px 16px;
      margin: 6px 0;
      width: 100%;
      font-size: 16px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      box-sizing: border-box;
      transition: all 0.3s ease;
      background: #f9fafb;
    }

    input:focus {
      border-color: var(--primary-color);
      background: #fff;
      outline: none;
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
    }

    button {
      padding: 14px;
      margin: 10px 0;
      width: 100%;
      font-size: 16px;
      font-weight: 600;
      background: var(--primary-color);
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 10px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px rgba(79, 70, 229, 0.2);
    }

    button:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 12px rgba(79, 70, 229, 0.3);
    }

    button:active {
      transform: translateY(1px);
    }

    .secondary-btn {
      background: transparent;
      color: var(--primary-color);
      border: 2px solid var(--primary-color);
      box-shadow: none;
      margin-top: 5px;
    }

    .secondary-btn:hover {
      background: rgba(79, 70, 229, 0.05);
      box-shadow: none;
    }

    .logout-btn {
      background: #f3f4f6;
      color: #4b5563;
      margin-top: 25px;
      box-shadow: none;
    }

    .logout-btn:hover {
      background: #e5e7eb;
      color: #1f2937;
      box-shadow: none;
    }

    .welcome-box {
      background: #e0e7ff;
      padding: 10px 15px;
      border-radius: 10px;
      color: #3730a3;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .table-container {
      overflow-x: auto;
      margin-top: 25px;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      font-size: 15px;
    }

    th, td {
      padding: 14px;
      text-align: center;
      border-bottom: 1px solid #e5e7eb;
    }

    th {
      background: #f8fafc;
      color: #64748b;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 0.5px;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }

    .badge-normal { background: #d1fae5; color: #065f46; }
    .badge-warning { background: #fef3c7; color: #92400e; }
    .badge-danger { background: #fee2e2; color: #991b1b; }

    .delete-btn {
      background: #fee2e2;
      color: var(--danger-color);
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      width: auto;
      margin: 0;
      box-shadow: none;
    }

    .delete-btn:hover {
      background: var(--danger-color);
      color: white;
      box-shadow: none;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    
    <!-- 1. የሎግኢን እና አካውንት መፍጠሪያ ክፍል -->
    <div id="auth-section">
      <h2 id="auth-title">Log In</h2>
      <div class="input-group">
        <input type="text" id="username" placeholder="Username (የመለያ ስም)" />
        <input type="password" id="password" placeholder="Password (የምስጢር ቁጥር)" />
      </div>
      <button id="main-auth-btn" onclick="login()">Log In</button>
      <button class="secondary-btn" id="toggle-auth-btn" onclick="toggleAuthMode()">Create an Account</button>
    </div>

    <!-- 2. ዋናው የስኳር መከታተያ ክፍል -->
    <div id="tracker-section" class="hidden">
      <h1>Blood Sugar Tracker</h1>
      
      <div class="welcome-box">
        <span>Welcome, <strong id="user-display"></strong>! 👋</span>
      </div>
      
      <div class="input-group">
        <input type="number" id="sugar" placeholder="Enter blood sugar level (mg/dL)" />
        <input type="text" id="note" placeholder="Note (e.g. fasting, after meal)" />
      </div>
      <button onclick="addRecord()">Add New Record</button>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Level</th>
              <th>Note</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="records"></tbody>
        </table>
      </div>

      <button class="logout-btn" onclick="logout()">Log Out</button>
    </div>

  </div>

  <script>
    let users = JSON.parse(localStorage.getItem("sugarUsers")) || {};
    let currentUser = localStorage.getItem("currentSugarUser") || null;
    let isLoginMode = true;

    if (currentUser) {
      showTracker();
    }

    function toggleAuthMode() {
      isLoginMode = !isLoginMode;
      const title = document.getElementById("auth-title");
      const mainBtn = document.getElementById("main-auth-btn");
      const toggleBtn = document.getElementById("toggle-auth-btn");

      if (isLoginMode) {
        title.innerText = "Log In";
        mainBtn.innerText = "Log In";
        toggleBtn.innerText = "Create an Account";
      } else {
        title.innerText = "Create Account";
        mainBtn.innerText = "Register & Log In";
        toggleBtn.innerText = "Already have an account? Log In";
      }
    }

    function login() {
      const user = document.getElementById("username").value.trim().toLowerCase();
      const pass = document.getElementById("password").value;

      if (!user || !pass) return alert("Please fill in all fields");

      if (isLoginMode) {
        if (users[user] && users[user].password === pass) {
          currentUser = user;
          localStorage.setItem("currentSugarUser", currentUser);
          showTracker();
        } else {
          alert("Incorrect username or password!");
        }
      } else {
        if (users[user]) {
          return alert("Username already exists!");
        }
        
        users[user] = { password: pass, data: [] };
        localStorage.setItem("sugarUsers", JSON.stringify(users));
        currentUser = user;
        localStorage.setItem("currentSugarUser", currentUser);
        showTracker();
      }

      document.getElementById("username").value = "";
      document.getElementById("password").value = "";
    }

    function showTracker() {
      document.getElementById("auth-section").classList.add("hidden");
      document.getElementById("tracker-section").classList.remove("hidden");
      document.getElementById("user-display").innerText = currentUser.toUpperCase();
      render();
    }

    function logout() {
      currentUser = null;
      localStorage.removeItem("currentSugarUser");
      document.getElementById("auth-section").classList.remove("hidden");
      document.getElementById("tracker-section").classList.add("hidden");
    }

    // የደም ስኳር መጠንን አይቶ ከለር የሚቀይር ተግባር
    function getSugarBadge(level) {
      const num = parseInt(level);
      if (num < 70) {
        return `<span class="badge badge-danger">${num} mg/dL (Low)</span>`;
      } else if (num <= 140) {
        return `<span class="badge badge-normal">${num} mg/dL (Normal)</span>`;
      } else if (num <= 199) {
        return `<span class="badge badge-warning">${num} mg/dL (High)</span>`;
      } else {
        return `<span class="badge badge-danger">${num} mg/dL (Very High)</span>`;
      }
    }

    function render() {
      const table = document.getElementById("records");
      table.innerHTML = "";

      let userData = users[currentUser].data || [];

      if (userData.length === 0) {
        table.innerHTML = `<tr><td colspan="4" style="color: #9ca3af; padding: 20px;">No records found. Start tracking!</td></tr>`;
        return;
      }

      userData.forEach((item, index) => {
        table.innerHTML += `
          <tr>
            <td style="color: #4b5563; font-size: 14px;">${item.date}</td>
            <td>${getSugarBadge(item.level)}</td>
            <td style="color: #4b5563;">${item.note || '-'}</td>
            <td><button class="delete-btn" onclick="deleteRecord(${index})">Delete</button></td>
          </tr>
        `;
      });
    }

    function addRecord() {
      const level = document.getElementById("sugar").value;
      const note = document.getElementById("note").value;

      if (!level) return alert("Please enter a blood sugar level");

      const record = {
        date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
        level: level,
        note: note
      };

      users[currentUser].data.unshift(record);
      localStorage.setItem("sugarUsers", JSON.stringify(users));

      document.getElementById("sugar").value = "";
      document.getElementById("note").value = "";

      render();
    }

    function deleteRecord(index) {
      if(confirm("Are you sure you want to delete this record?")) {
        users[currentUser].data.splice(index, 1);
        localStorage.setItem("sugarUsers", JSON.stringify(users));
        render();
      }
    }
  </script>
</body>
</html>
