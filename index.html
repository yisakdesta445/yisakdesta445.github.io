<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium TV PDF Reader with Page Jump</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at center, #141923 0%, #080a0f 100%);
            --card-bg: rgba(25, 34, 49, 0.65);
            --primary-glow: #00f2fe;
            --accent-color: #4facfe;
            --text-main: #ffffff;
            --text-muted: #a0aec0;
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* የማስተዋወቂያ ስክሪን (Splash Screen) */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #1a2230 0%, #05070a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out, visibility 0.5s;
        }

        .splash-title {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 4px;
            background: linear-gradient(to right, #ffffff, #cfd9df);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* የፋይል ማስመረጫ ገጽ */
        #file-selector-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100%;
            padding: 20px;
        }

        .upload-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 50px 40px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6), inset 0 1px 1px var(--glass-border);
            border: 1px solid var(--glass-border);
            max-width: 550px;
            width: 100%;
        }

        #file-input {
            display: none;
        }

        /* ዋናው የንባብ ገጽ (Cinema Viewer) */
        #main-viewer {
            display: none;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            position: relative;
        }

        /* የተስተካከለ የላይኛው የመስታወት አሞሌ */
        .app-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background-color: rgba(10, 14, 22, 0.4);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
            z-index: 100;
        }

        .brand-text {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-text i {
            color: var(--primary-glow);
            filter: drop-shadow(0 0 8px var(--primary-glow));
        }

        /* PDF የፊልም እይታ ክፍል */
        #pdf-container {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-y: auto;
            overflow-x: auto;
            background: #060709;
            padding-top: 95px; /* ከባሩ በታች በምቾት እንዲጀምር */
            padding-bottom: 115px; /* ከታችኛው ባር እንዳይጋጭ */
            scroll-behavior: smooth;
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 12px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85);
            max-width: 95%;
            height: auto;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* የተስተካከለ እና ሙሉ ይዘት የያዘው የታችኛው የቁጥጥር ባር */
        .control-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 90px;
            background-color: rgba(10, 14, 22, 0.6);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            display: flex;
            justify-content: cubic-bezier(0.16, 1, 0.3, 1);
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            border-top: 1px solid var(--glass-border);
            box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.4);
            z-index: 100;
        }

        .controls-left, .controls-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* የቅንጦት የሪሞት አዝራሮች */
        .btn {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .btn:focus, .btn:hover {
            background: linear-gradient(135deg, var(--primary-glow), var(--accent-color));
            color: #040608;
            border-color: #ffffff;
            outline: none;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 242, 254, 0.35);
        }

        .info-badge {
            font-size: 14px;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 20px;
            border-radius: 14px;
            border: 1px solid var(--glass-border);
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 1. የገጽ ቁጥር ማዘለያ ሳጥን ዲዛይን (Page Jump Input) */
        .page-jump-container {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 2px 10px;
            gap: 5px;
        }

        .page-input {
            width: 60px;
            background: transparent;
            border: none;
            color: var(--primary-glow);
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            outline: none;
            padding: 8px 0;
        }

        /* በሪሞት ቁጥር ሳጥኑ ላይ ሲያርፍ የሚፈጠር ፍንጣቂ ብርሃን */
        .page-jump-container:focus-within {
            border-color: var(--primary-glow);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <h1 class="splash-title">NEXUS TV READER</h1>
    </div>

    <div id="file-selector-container">
        <div class="upload-card">
            <h2 style="font-size: 26px; font-weight: 700; margin-bottom: 25px;">ፒዲኤፍ ፋይል ይክፈቱ</h2>
            <input type="file" id="file-input" accept="application/pdf">
            <button class="btn" id="browse-btn" style="margin: 0 auto; padding: 14px 40px;" autofocus>ፋይል ፈልግ (OK)</button>
        </div>
    </div>

    <div id="main-viewer">
        <div class="app-header">
            <div class="brand-text"><i class="fa-solid fa-tv"></i> <span>NEXUS MEDIA</span></div>
            <button class="btn" id="back-to-menu-btn" style="padding: 6px 18px; font-size: 13px;"><i class="fa-solid fa-arrow-rotate-left"></i> ዝጋ</button>
        </div>

        <div id="pdf-container">
            <canvas id="pdf-canvas"></canvas>
        </div>

        <div class="control-bar">
            <div class="controls-left">
                <button id="prev-btn" class="btn"><i class="fa-solid fa-chevron-left"></i> የበፊቱ</button>
                
                <div class="page-jump-container">
                    <input type="number" id="current-page-input" class="page-input" value="1" min="1">
                    <span style="color: var(--text-muted); font-weight: 600;">/ <span id="total-pages-text">0</span></span>
                </div>

                <button id="next-btn" class="btn">ቀጣይ <i class="fa-solid fa-chevron-right"></i></button>
            </div>
            
            <div class="controls-right">
                <span class="info-badge">
                    <i class="fa-solid fa-expand" style="color: var(--primary-glow);"></i>
                    <span id="zoom-info">100%</span>
                </span>
                
                <span class="info-badge" style="background: rgba(255,255,255,0.01); color: var(--text-muted); font-size: 12px;">
                    [CH+/CH-] ዙም | [ቀስቶች] ማሸብለያ
                </span>
            </div>
        </div>
    </div>

    <script>
        let pdfDoc = null,
            pageNum = 1,
            pageIsRendering = false,
            pageNumPending = null,
            scale = 1.4;

        const canvas = document.getElementById('pdf-canvas'),
              ctx = canvas.getContext('2d'),
              container = document.getElementById('pdf-container'),
              pageInput = document.getElementById('current-page-input');

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 500);
            }, 1500);
        });

        const fileInput = document.getElementById('file-input');
        document.getElementById('browse-btn').addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file && file.type === "application/pdf") {
                const fileReader = new FileReader();
                fileReader.onload = function() {
                    const typedarray = new Uint8Array(this.result);
                    loadPdf(typedarray);
                };
                fileReader.readAsArrayBuffer(file);
            }
        });

        function loadPdf(data) {
            pdfjsLib.getDocument(data).promise.then(pdfDoc_ => {
                pdfDoc = pdfDoc_;
                document.getElementById('total-pages-text').textContent = pdfDoc.numPages;
                pageInput.max = pdfDoc.numPages;
                
                document.getElementById('file-selector-container').style.display = 'none';
                document.getElementById('main-viewer').style.display = 'flex';
                renderPage(pageNum);
                document.getElementById('next-btn').focus();
            }).catch(err => {
                alert('ፒዲኤፍ መክፈት አልተቻለም!');
            });
        }

        const renderPage = num => {
            pageIsRendering = true;
            pdfDoc.getPage(num).then(page => {
                if (scale > 1.4) {
                    canvas.style.maxWidth = 'none';
                } else {
                    canvas.style.maxWidth = '95%';
                }

                const viewport = page.getViewport({ scale: scale });
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                const renderContext = { canvasContext: ctx, viewport };

                page.render(renderContext).promise.then(() => {
                    pageIsRendering = false;
                    if (pageNumPending !== null) {
                        renderPage(pageNumPending);
                        pageNumPending = null;
                    }
                });
                pageInput.value = num; // የሳጥኑን ቁጥር ወቅታዊ ማድረግ
                document.getElementById('zoom-info').textContent = `${Math.round(scale * 100)}%`;
            });
        };

        const queueRenderPage = num => {
            if (pageIsRendering) {
                pageNumPending = num;
            } else {
                renderPage(num);
            }
        };

        // የገጽ ቁጥር እራስህ አስገብተህ Enter ስትጫን በቀጥታ ማዘለያ ማስተካከያ
        pageInput.addEventListener('change', (e) => {
            let targetPage = parseInt(e.target.value);
            if (pdfDoc && targetPage >= 1 && targetPage <= pdfDoc.numPages) {
                pageNum = targetPage;
                queueRenderPage(pageNum);
                container.scrollTop = 0;
            } else {
                e.target.value = pageNum; // ስህተት ቁጥር ከተጻፈ ወደ ነበረበት ይመልሰዋል
            }
        });

        const showPrevPage = () => {
            if (pageNum <= 1) return;
            pageNum--;
            queueRenderPage(pageNum);
            container.scrollTop = 0;
        };

        const showNextPage = () => {
            if (pdfDoc && pageNum >= pdfDoc.numPages) return;
            pageNum++;
            queueRenderPage(pageNum);
            container.scrollTop = 0;
        };

        const zoomIn = () => {
            if (scale >= 4.0) return;
            scale += 0.2;
            queueRenderPage(pageNum);
        };

        const zoomOut = () => {
            if (scale <= 0.8) return;
            scale -= 0.2;
            queueRenderPage(pageNum);
        };

        // የሪሞት መቆጣጠሪያ
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('main-viewer').style.display === 'flex') {
                
                if (e.key === 'PageUp' || e.keyCode === 166 || e.keyCode === 33) { 
                    e.preventDefault();
                    zoomIn();
                } else if (e.key === 'PageDown' || e.keyCode === 167 || e.keyCode === 34) { 
                    e.preventDefault();
                    zoomOut();
                }
                else if (e.key === 'ArrowLeft') {
                    // Focus ቁጥሩ ላይ ካልሆነ ገጽ ይቀይራል
                    if (document.activeElement !== pageInput) {
                        showPrevPage();
                        document.getElementById('prev-btn').focus();
                    }
                } else if (e.key === 'ArrowRight') {
                    if (document.activeElement !== pageInput) {
                        showNextPage();
                        document.getElementById('next-btn').focus();
                    }
                } else if (e.key === 'ArrowUp') {
                    container.scrollTop -= 70; 
                    e.preventDefault();
                } else if (e.key === 'ArrowDown') {
                    container.scrollTop += 70;
                    e.preventDefault();
                }
            }
        });

        document.getElementById('prev-btn').addEventListener('click', showPrevPage);
        document.getElementById('next-btn').addEventListener('click', showNextPage);
        
        document.getElementById('back-to-menu-btn').addEventListener('click', () => {
            pageNum = 1;
            scale = 1.4;
            document.getElementById('main-viewer').style.display = 'none';
            document.getElementById('file-selector-container').style.display = 'flex';
            document.getElementById('browse-btn').focus();
        });
    </script>
</body>
</html>
