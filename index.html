<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Glassmorphism TV PDF Reader</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: rgba(31, 40, 51, 0.8); /* ለመስታወት ውጤት ግልጽነት ያለው ከለር */
            --primary-glow: #66fcf1;
            --text-color: #c5c6c7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        /* የማስተዋወቂያ ስክሪን (Splash Screen) */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #1f2833 0%, #0b0c10 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out, visibility 0.5s;
        }

        .splash-logo {
            font-size: 80px;
            color: var(--primary-glow);
            text-shadow: 0 0 20px var(--primary-glow);
            margin-bottom: 20px;
        }

        /* የፋይል መምረጫ ስክሪን */
        #file-selector-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100%;
        }

        .upload-card {
            background-color: #1f2833;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px dashed var(--primary-glow);
            max-width: 500px;
            width: 90%;
        }

        #file-input {
            display: none;
        }

        /* ዋናው የንባብ ገጽ */
        #main-viewer {
            display: none;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            position: relative;
        }

        /* 1. የመስታወት አሞሌ (Glassmorphism Header) */
        .app-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: rgba(31, 40, 51, 0.45); /* በጣም ቀጭን ከለር */
            backdrop-filter: blur(12px); /* ከጀርባ ያለውን ፒዲኤፍ ብዥ አድርጎ እንደ መስታወት የሚያሳይ */
            -webkit-backdrop-filter: blur(12px);
            padding: 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            z-index: 100;
        }

        .brand {
            font-size: 20px;
            font-weight: bold;
            color: var(--primary-glow);
            text-shadow: 0 0 10px rgba(102, 252, 241, 0.3);
        }

        /* PDF መያዣ ክፍል */
        #pdf-container {
            position: fixed;
            top: 0; /* ሙሉ ስክሪን ሆኖ ከሄደሩ በታች እንዲያልፍ ከላይ 0 ሆኗል */
            bottom: 0; /* ከታችኛው ባር በታች እንዲያልፍ 0 ሆኗል */
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-y: auto;
            overflow-x: auto;
            background: #121212;
            padding-top: 80px; /* ጽሑፉ መጀመሪያ ሲከፈት በሄደሩ እንዳይጋረድ ማድረጊያ */
            padding-bottom: 90px;
            scroll-behavior: smooth;
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            max-width: 100%;
            height: auto;
        }

        /* የታችኛው የቁጥጥር ባር (ይህም የመስታወት ውጤት አለው) */
        .control-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background-color: rgba(31, 40, 51, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 20px;
            gap: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
        }

        .btn {
            background-color: rgba(11, 12, 16, 0.8);
            color: #ffffff;
            border: 2px solid #2c3540;
            padding: 8px 22px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn:focus, .btn:hover {
            background-color: var(--primary-glow);
            color: #0b0c10;
            outline: none;
            transform: scale(1.08);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .info-badge {
            font-size: 15px;
            font-weight: bold;
            background: rgba(11, 12, 16, 0.8);
            padding: 6px 15px;
            border-radius: 20px;
            border: 1px solid #2c3540;
            display: flex;
            align-items: center;
            gap: 5px;
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <i class="fa-solid fa-book-open-reader splash-logo"></i>
        <h2 style="letter-spacing: 2px;">NEXUS TV READER</h2>
    </div>

    <div id="file-selector-container">
        <div class="upload-card">
            <i class="fa-solid fa-folder-open" style="font-size: 60px; color: var(--primary-glow); margin-bottom: 20px;"></i>
            <h3 style="margin-bottom: 10px;">PDF ፋይል ይምረጡ</h3>
            <input type="file" id="file-input" accept="application/pdf">
            <button class="btn" id="browse-btn" style="margin: 0 auto;" autofocus><i class="fa-solid fa-search"></i> ፋይል ፈልግ (OK)</button>
        </div>
    </div>

    <div id="main-viewer">
        <div class="app-header">
            <div class="brand"><i class="fa-solid fa-display"></i> Smart TV Reader</div>
            <button class="btn" id="back-to-menu-btn" style="padding: 4px 12px; font-size: 11px;"><i class="fa-solid fa-home"></i> ዝጋ</button>
        </div>

        <div id="pdf-container">
            <canvas id="pdf-canvas"></canvas>
        </div>

        <div class="control-bar">
            <button id="prev-btn" class="btn"><i class="fa-solid fa-arrow-left"></i> የበፊቱ</button>
            <span class="info-badge">
                <i class="fa-regular fa-file-lines" style="color: var(--primary-glow);"></i>
                <span id="page-info">0 / 0</span>
            </span>
            <button id="next-btn" class="btn">ቀጣይ <i class="fa-solid fa-arrow-right"></i></button>
            
            <span class="info-badge">
                <i class="fa-solid fa-magnifying-glass" style="color: var(--primary-glow);"></i>
                <span id="zoom-info">100%</span>
            </span>
        </div>
    </div>

    <script>
        let pdfDoc = null,
            pageNum = 1,
            pageIsRendering = false,
            pageNumPending = null,
            scale = 1.3;

        const canvas = document.getElementById('pdf-canvas'),
              ctx = canvas.getContext('2d'),
              container = document.getElementById('pdf-container');

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 500);
            }, 1500);
        });

        const fileInput = document.getElementById('file-input');
        document.getElementById('browse-btn').addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file && file.type === "application/pdf") {
                const fileReader = new FileReader();
                fileReader.onload = function() {
                    const typedarray = new Uint8Array(this.result);
                    loadPdf(typedarray);
                };
                fileReader.readAsArrayBuffer(file);
            }
        });

        function loadPdf(data) {
            pdfjsLib.getDocument(data).promise.then(pdfDoc_ => {
                pdfDoc = pdfDoc_;
                document.getElementById('file-selector-container').style.display = 'none';
                document.getElementById('main-viewer').style.display = 'flex';
                renderPage(pageNum);
                document.getElementById('next-btn').focus();
            }).catch(err => {
                alert('ፒዲኤፍ መክፈት አልተቻለም!');
            });
        }

        const renderPage = num => {
            pageIsRendering = true;
            pdfDoc.getPage(num).then(page => {
                if (scale > 1.3) {
                    canvas.style.maxWidth = 'none';
                } else {
                    canvas.style.maxWidth = '100%';
                }

                const viewport = page.getViewport({ scale: scale });
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                const renderContext = { canvasContext: ctx, viewport };

                page.render(renderContext).promise.then(() => {
                    pageIsRendering = false;
                    if (pageNumPending !== null) {
                        renderPage(pageNumPending);
                        pageNumPending = null;
                    }
                });
                document.getElementById('page-info').textContent = `${num} / ${pdfDoc.numPages}`;
                document.getElementById('zoom-info').textContent = `${Math.round(scale * 100)}%`;
            });
        };

        const queueRenderPage = num => {
            if (pageIsRendering) {
                pageNumPending = num;
            } else {
                renderPage(num);
            }
        };

        const showPrevPage = () => {
            if (pageNum <= 1) return;
            pageNum--;
            queueRenderPage(pageNum);
            container.scrollTop = 0;
        };

        const showNextPage = () => {
            if (pdfDoc && pageNum >= pdfDoc.numPages) return;
            pageNum++;
            queueRenderPage(pageNum);
            container.scrollTop = 0;
        };

        const zoomIn = () => {
            if (scale >= 4.0) return;
            scale += 0.2;
            queueRenderPage(pageNum);
        };

        const zoomOut = () => {
            if (scale <= 0.8) return;
            scale -= 0.2;
            queueRenderPage(pageNum);
        };

        // የሪሞት ቁልፎች ሙሉ ስርጭት
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('main-viewer').style.display === 'flex') {
                
                // 1. የቻናል ቁልፎች ለዙም ቁጥጥር (CH+ / CH-)
                if (e.key === 'PageUp' || e.keyCode === 166 || e.keyCode === 33) { 
                    // CH+ ከተጫነ ዙም ይጨምራል
                    e.preventDefault();
                    zoomIn();
                } else if (e.key === 'PageDown' || e.keyCode === 167 || e.keyCode === 34) { 
                    // CH- ከተጫነ ዙም ይቀንሳል
                    e.preventDefault();
                    zoomOut();
                }
                
                // 2. ቀስት ቁልፎች ለገጽ መቀየር እና ለስክሮል ብቻ
                else if (e.key === 'ArrowLeft') {
                    showPrevPage();
                    document.getElementById('prev-btn').focus();
                } else if (e.key === 'ArrowRight') {
                    showNextPage();
                    document.getElementById('next-btn').focus();
                } else if (e.key === 'ArrowUp') {
                    // የላይኛው ቀስት ጽሑፉን ወደላይ ብቻ ያንሸራትታል
                    container.scrollTop -= 60; 
                    e.preventDefault();
                } else if (e.key === 'ArrowDown') {
                    // የታችኛው ቀስት ጽሑፉን ወደታች ብቻ ያንሸራትታል
                    container.scrollTop += 60;
                    e.preventDefault();
                }
            }
        });

        document.getElementById('prev-btn').addEventListener('click', showPrevPage);
        document.getElementById('next-btn').addEventListener('click', showNextPage);
        
        document.getElementById('back-to-menu-btn').addEventListener('click', () => {
            pageNum = 1;
            scale = 1.3;
            document.getElementById('main-viewer').style.display = 'none';
            document.getElementById('file-selector-container').style.display = 'flex';
            document.getElementById('browse-btn').focus();
        });
    </script>
</body>
</html>
